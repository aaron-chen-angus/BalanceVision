<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes">
  <meta name="description" content="BalanceVision - AI-Assisted Single-Leg Balance Assessment using computer vision">
  <meta name="theme-color" content="#0a1628">
  
  <title>BalanceVision — Single-Leg Balance Assessment</title>
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Chart.js (optional, for results visualisation) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  
  <!-- MediaPipe Tasks Vision (loaded as module for dynamic import support) -->
  <script type="module">
    import { PoseLandmarker, FilesetResolver, DrawingUtils } from 
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs';
    window.__mediapipe = { PoseLandmarker, FilesetResolver, DrawingUtils };
    window.dispatchEvent(new Event('mediapipe-ready'));
  </script>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
</head>
<body>
  <!-- App Root -->
  <div id="app" role="application" aria-label="BalanceVision Balance Assessment Application">
    <!-- Loading state -->
    <div class="screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
      <div style="text-align:center;">
        <h1 style="color:#00e5ff;margin-bottom:16px;">BalanceVision</h1>
        <p style="color:#b0bec5;">Loading application...</p>
      </div>
    </div>
  </div>

  <!-- Application Scripts (order matters) -->
  <script src="config.js"></script>
  <script src="balance-engine.js"></script>
  <script src="results.js"></script>
  <script src="app.js"></script>
</body>
</html>
